<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 1</title>
    <link rel="stylesheet" href="../style.css">
    <style>
    
   body {
  display: grid;
  grid-template-rows:  10% 20% 1fr 10%;
  grid-template-columns: 10% 20% 1fr;
  gap: 20px;
}

main{
  grid-row: 2/4;
  grid-column:2/4;
}

nav{
  grid-row: 2/4;
}

header {
  grid-column: 1 / 4;
}

footer {
  grid-row-start: 4;
  grid-column: 1/4;
}
      
    </style>
  </head>
  <body id="basic-layout-1">
    <header><h1>Basic Layout 1</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
